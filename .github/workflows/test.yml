name: Offline Tests

# 触发条件:
#  - push 到 main / PR 时跑离线回归测试 (质量门禁)
#  - 供 release.yml 通过 workflow_call 复用: 构建发布前必须先全绿
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

# CI Windows 控制台默认 cp1252, 测试脚本打印中文/✓ 会 UnicodeEncodeError
# (同 build_exe.py 的 e085eb5 修复), 全 workflow 强制 Python UTF-8 模式
env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: Offline Regression (unittest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      # 离线测试不联网, 但被测模块 import 链需要 requirements 里的依赖
      # (requests/bs4/selenium 等); ddddocr/onnxruntime 体积大但 build 同样要装
      # -c requirements-lock.txt: 钉精确版本, 防上游跳版本致"本机能跑 CI 跑不了"
      # (constraints 只约束版本, 不改变装哪些包; 刷新见 脚本/gen_lock.py)
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s 测试 -v

      # M12: 手写回归脚本不被 unittest discover 收集, 显式纳入门禁
      - name: Run standalone regression suite
        run: python 测试/回归测试_修复验证.py

      # M13: 本机 脚本/发布流程.py 的门禁是**三步**(单测 / 手写回归 / 静态检查),
      # 而 CI 此前只有前两步 —— 造成"CI 绿灯 ≠ 可打包" (2026-10-04 审查发现)。
      # check_undefined_refs.py 用 symtable + AST 抓"引用未定义 / from X import 不存在的名字",
      # 历史上真抓出过 NameError 事故, 必须有"非 0 退出即失败"的门禁地位。
      - name: Run undefined-reference static check
        run: python 脚本/check_undefined_refs.py

      # S1 (2026-10-24): 站点策略「阶段词汇」与适配器「声明阶段」双侧对齐。
      # 适配器声明了代码里不存在的阶段 = 拼写漂移/阶段被删 ⇒ 静默走回通用规则，线上极难发现。
      # 公开形态无本地适配器 ⇒ 恒通过；本机全功能形态才有实际校验价值。
      - name: Run site-strategy stage coverage check
        run: python 脚本/检查阶段覆盖.py --严格
