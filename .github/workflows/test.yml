name: Offline Tests

# 触发条件:
#  - push 到 main / PR 时跑离线回归测试 (质量门禁)
#  - 供 release.yml 通过 workflow_call 复用: 构建发布前必须先全绿
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Offline Regression (unittest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      # 离线测试不联网, 但被测模块 import 链需要 requirements 里的依赖
      # (requests/bs4/selenium 等); ddddocr/onnxruntime 体积大但 build 同样要装
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s 测试 -v
