name: Build & Release EXE

# 触发条件:
#  - push 形如 v2.3.0 的 git tag 时自动构建并发布 Release (附 SHA256)
#  - 也可在 GitHub Actions 页面手动触发 (workflow_dispatch) 调试
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 需要写权限才能创建 Release 并上传资产
permissions:
  contents: write

jobs:
  # 质量门禁: 发布前离线回归必须全绿 (test.yml 以 workflow_call 被本流程复用)
  test:
    name: Offline Regression (unittest)
    uses: ./.github/workflows/test.yml

  build:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      # build_exe.py 依赖 .venv/ 路径 (找 pyinstaller 与 ddddocr 模型目录),
      # 因此 CI 必须建虚拟环境, 不能直接用系统 python
      - name: Create venv & install deps
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/pip.exe install -r requirements.txt
          .venv/Scripts/pip.exe install pyinstaller

      # Rust 加速扩展: pyd 不入库 (gitignore), CI 现场编译后打进 EXE
      # (M12: 旧发布产物永远纯 Python 且无人知晓; 失败不阻塞, 仅纯 Python 发布)
      - name: Build rust_core.pyd (Rust 加速, best-effort)
        shell: bash
        run: |
          .venv/Scripts/python.exe -m pip install maturin
          # 路径修正: 该命令从 rust_core_poc/pyo3_ext 出发, ../.venv 会解析到
          # rust_core_poc/.venv(不存在) → 旧写法必然失败, 又被 || 静默吞掉,
          # 导致 CI 发布的 EXE 永远没有 Rust 加速。须回退两级到仓库根的 .venv。
          (cd rust_core_poc/pyo3_ext && ../../.venv/Scripts/python.exe -m maturin build --release) \
            || { echo "[WARN] rust_core 编译失败, 本次发布为纯 Python"; exit 0; }
          .venv/Scripts/python.exe -c "
          import glob, zipfile, shutil
          whls = sorted(glob.glob('rust_core_poc/pyo3_ext/target/wheels/*.whl'))
          assert whls, 'maturin 未产出 wheel'
          with zipfile.ZipFile(whls[-1]) as z:
              name = [n for n in z.namelist() if n.endswith('.pyd')][0]
              with z.open(name) as src, open('源码/rust_core.pyd', 'wb') as dst:
                  shutil.copyfileobj(src, dst)
          print('rust_core.pyd 已就位')
          "

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          VER="${REF#v}"
          if [ "${VER}" = "${REF}" ]; then
            VER="0.0.0-ci"
          fi
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build EXE
        run: |
          .venv\Scripts\python.exe 脚本\build_exe.py --version=${{ steps.ver.outputs.VER }}
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== build_log.txt (末尾 60 行) ====="
            Get-Content build_log.txt -Tail 60 -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
          Get-ChildItem dist

      - name: Compute SHA256 & package adapters
        run: |
          # GitHub 会把含中文的资产名重命名成 default.*, 故统一改用 ASCII 文件名再上传
          $ver = "${{ steps.ver.outputs.VER }}"
          $exe = "dist\novel-crawler-v$ver.exe"
          $shaFile = "dist\novel-crawler-v$ver.exe.sha256"
          $adp = "dist\site-adapters-v$ver.zip"
          Move-Item -Path 'dist\小说爬虫.exe' -Destination $exe -Force
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  $exe" | Set-Content -Path $shaFile -Encoding ascii
          # 站点适配/ 存在时才打包 (仓库未收录时跳过, 不影响 EXE 主产物)
          if (Test-Path '站点适配') {
            Compress-Archive -Path '站点适配' -DestinationPath $adp -Force
          } else {
            Write-Host "[WARN] 站点适配/ 未入库, 跳过 zip (适配器不影响 EXE 主产物)"
          }
          Get-ChildItem dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/novel-crawler-v${{ steps.ver.outputs.VER }}.exe
            dist/novel-crawler-v${{ steps.ver.outputs.VER }}.exe.sha256
            dist/site-adapters-v${{ steps.ver.outputs.VER }}.zip
          name: 小说爬虫 v${{ steps.ver.outputs.VER }}
          body: |
            ## 小说爬虫 v${{ steps.ver.outputs.VER }}

            - **EXE** (onefile 单文件便携版): `novel-crawler-v${{ steps.ver.outputs.VER }}.exe`
            - **SHA256**: `novel-crawler-v${{ steps.ver.outputs.VER }}.exe.sha256` (用于校验下载完整性)
            - **站点适配器**: `site-adapters-v${{ steps.ver.outputs.VER }}.zip` (免重新打包扩展新站, 解压到 EXE 同目录)

            ### 使用说明
            - 双击 `novel-crawler-v${{ steps.ver.outputs.VER }}.exe` 启动 GUI; 首次运行会在 EXE 同目录生成 `站点配置.json`、`抓取结果/` 等
            - 目标机需安装 Chrome (Selenium 反爬兜底) 与 ddddocr 可选识别模型
            - 扩展新站: 把适配器 .py 放入 EXE 同目录 `站点适配/` 即可 (详见 文档/SITE_ADAPTER.md)

            > 仅供个人学习与研究使用, 请遵守相关法律法规及目标网站服务条款。
