<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读</title>
<style>
  :root { --bg:#f6f1e7; --fg:#3a3226; --dim:#9a8f7c; }
  .dark { --bg:#101418; --fg:#c8cdd6; --dim:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:18px/1.9 system-ui,"Microsoft YaHei",serif; }
  #bar { position:sticky; top:0; z-index:2; display:flex; gap:6px;
         align-items:center; padding:8px 10px; background:var(--bg);
         border-bottom:1px solid color-mix(in srgb, var(--fg) 12%, transparent); }
  button { border:0; border-radius:6px; padding:6px 12px; cursor:pointer;
           background:color-mix(in srgb, var(--fg) 10%, transparent);
           color:var(--fg); font-size:14px; }
  #title { flex:1; text-align:center; font-size:15px; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  #content { max-width:640px; margin:0 auto; padding:18px 16px 60px;
             white-space:pre-wrap; word-break:break-word; }
  #nav { display:flex; justify-content:space-between; max-width:640px;
         margin:0 auto 40px; gap:10px; }
  #nav button { flex:1; padding:12px; }
  #toc { position:fixed; inset:0; background:var(--bg); z-index:3; display:none;
         overflow-y:auto; padding:14px; }
  #toc div { padding:9px 6px; border-bottom:1px solid
             color-mix(in srgb, var(--fg) 10%, transparent); cursor:pointer; }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<div id="bar">
  <button onclick="toggleToc()">目录</button>
  <div id="title" class="dim">加载中…</div>
  <button onclick="字号(-1)">A-</button>
  <button onclick="字号(1)">A+</button>
  <button onclick="toggleDark()">☾</button>
</div>
<div id="content"></div>
<div id="nav">
  <button id="prev" onclick="跳章(-1)">上一章</button>
  <button id="next" onclick="跳章(1)">下一章</button>
</div>
<div id="toc"></div>

<script>
'use strict';
var qs = new URLSearchParams(location.search);
var token = qs.get('k') || sessionStorage.getItem('远控token') || '';
sessionStorage.setItem('远控token', token);
var bookId = location.pathname.split('/').pop();
var 章节 = [];          // [{序, 标题}]
var 当前 = parseInt(sessionStorage.getItem('进度_' + bookId) || '-1', 10);
var 标记 = '字号_' + bookId;

function api(path) {
  var sep = path.includes('?') ? '&' : '?';
  return fetch(path + sep + '_=' + Date.now(),
               { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function (r) {
      if (r.status === 401) throw new Error('token 无效, 请从面板重新进入');
      return r;
    });
}

function 字号(d) {
  var body = document.getElementById('content');
  var size = Math.min(30, Math.max(13,
      parseInt(getComputedStyle(body).fontSize) + d));
  body.style.fontSize = size + 'px';
  localStorage.setItem(标记, size);
}
function toggleDark() { document.body.classList.toggle('dark'); }
function toggleToc() {
  var t = document.getElementById('toc');
  t.style.display = t.style.display === 'block' ? 'none' : 'block';
}

function 渲染(i) {
  if (!章节.length) return;
  当前 = Math.min(章节.length - 1, Math.max(0, i));
  api('/api/v1/books/' + bookId + '/content/' + 当前)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var c = document.getElementById('content');
      c.textContent = '';
      var h = document.createElement('div');
      h.style.fontWeight = '700'; h.style.marginBottom = '14px';
      h.textContent = j.标题;
      c.appendChild(h);
      c.appendChild(document.createTextNode(j.内容));
      document.getElementById('title').textContent =
        j.标题 + '  (' + (j.序 + 1) + '/' + j.总章数 + ')';
      document.getElementById('prev').disabled = j.序 <= 0;
      document.getElementById('next').disabled = j.序 >= j.总章数 - 1;
      window.scrollTo(0, 0);
      sessionStorage.setItem('进度_' + bookId, j.序);
      api('/api/v1/books/' + bookId + '/progress',
          { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 章节: j.序 }) }).catch(function () {});
    }).catch(function (e) {
      document.getElementById('content').textContent = e.message;
    });
}
function 跳章(d) { 渲染(当前 + d); }

var fs = parseInt(localStorage.getItem(标记) || '18', 10);
if (fs) document.getElementById('content').style.fontSize = fs + 'px';

api('/api/v1/books/' + bookId + '/chapters')
  .then(function (r) { return r.json(); })
  .then(function (j) {
    章节 = j.章节;
    var toc = document.getElementById('toc');
    j.章节.forEach(function (c) {
      var d = document.createElement('div');
      d.textContent = (c.序 + 1) + '. ' + c.标题;
      d.onclick = function () { toggleToc(); 渲染(c.序); };
      toc.appendChild(d);
    });
    渲染(当前 >= 0 ? 当前 : Math.min(j.进度, 章节.length - 1));
  }).catch(function (e) {
    document.getElementById('content').textContent = e.message;
  });
</script>
</body>
</html>
