<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说爬虫 · 远控</title>
<style>
  :root { --bg:#11151c; --card:#1a2029; --fg:#dde3ec; --dim:#8b94a3;
          --acc:#4cc2ff; --ok:#6ccb5f; --warn:#fce100; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
  h2 { font-size:16px; margin:18px 0 8px; color:var(--acc); }
  .card { background:var(--card); border-radius:10px; padding:12px; margin-bottom:12px; }
  input[type=text] { width:100%; padding:8px; border-radius:6px; border:1px solid #333;
                     background:#0d1015; color:var(--fg); font-size:14px; }
  button { padding:7px 14px; border:0; border-radius:6px; background:var(--acc);
           color:#08131c; font-weight:600; cursor:pointer; }
  button.sec { background:#2a3240; color:var(--fg); }
  button.danger { background:var(--err); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:5px 6px; border-bottom:1px solid #232b36; }
  .st-running{color:var(--acc)} .st-completed{color:var(--ok)}
  .st-failed{color:var(--err)} .st-stopped{color:var(--warn)}
  .log { background:#0a0d12; border-radius:8px; height:260px; overflow-y:auto;
         padding:8px; font:12px/1.45 Consolas,monospace; white-space:pre-wrap;
         word-break:break-all; }
  .dim { color:var(--dim); font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .book { display:flex; justify-content:space-between; gap:8px; padding:6px 0;
          border-bottom:1px solid #232b36; align-items:center; }
</style>
</head>
<body>
<h2 style="margin-top:0">小说爬虫 · 远控面板</h2>

<div class="card">
  <div class="row"><input type="text" id="url" placeholder="小说目录页 URL"></div>
  <div class="row" style="margin-top:8px">
    <select id="mode">
      <option value="full">完整抓取</option>
      <option value="test">测试 (前3章)</option>
    </select>
    <label><input type="checkbox" id="resume" checked> 断点续传</label>
    <label><input type="checkbox" id="epub"> 导出 EPUB</label>
    <button onclick="发任务()">开始抓取</button>
    <span id="msg" class="dim"></span>
  </div>
</div>

<h2>任务列表</h2>
<div class="card">
  <table><thead><tr>
    <th>任务</th><th>状态</th><th>进度</th><th>耗时</th><th>操作</th>
  </tr></thead><tbody id="tasks"></tbody></table>
  <div id="log" class="log" style="margin-top:10px; display:none"></div>
</div>

<h2>书架 (抓取结果)</h2>
<div class="card" id="books"><span class="dim">加载中…</span></div>
<p class="dim">token 存于本机浏览器。服务默认仅监听本机, 外网访问请经 Tailscale。</p>

<script>
'use strict';
var token = localStorage.getItem('远控token') || '';
var 日志目标 = null;   // 当前展开日志的任务 id
var 日志指针 = 0;

function 取token() {
  if (!token) {
    token = (prompt('输入访问 token (见常驻机 数据/远控配置.json)') || '').trim();
    localStorage.setItem('远控token', token);
  }
  return token;
}
function api(path, opt) {
  取token();
  var sep = path.includes('?') ? '&' : '?';
  opt = opt || {};
  opt.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opt.headers || {});
  return fetch(path + sep + '_=' + Date.now(), opt).then(function (r) {
    if (r.status === 401) {
      localStorage.removeItem('远控token'); token = '';
      throw new Error('token 无效, 请刷新页面重新输入');
    }
    return r;
  });
}
function 提示(s) { document.getElementById('msg').textContent = s; }

// 所有动态内容一律 textContent, 杜绝站点内容进日志引发的 XSS
function 发任务() {
  var url = document.getElementById('url').value.trim();
  if (!url) { 提示('请输入 URL'); return; }
  var body = {
    url: url,
    mode: document.getElementById('mode').value,
    resume: document.getElementById('resume').checked,
    export_epub: document.getElementById('epub').checked
  };
  api('/api/v1/tasks', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.detail || r.status);
        提示('已创建 ' + j.task_id);
        刷新任务();
    }); })
    .catch(function (e) { 提示('失败: ' + e.message); });
}

function 停止(id) {
  api('/api/v1/tasks/' + id + '/stop', { method: 'POST' })
    .then(function () { 刷新任务(); })
    .catch(function (e) { 提示('停止失败: ' + e.message); });
}

function 展开日志(id) {
  日志目标 = (日志目标 === id) ? null : id;
  日志指针 = 0;
  var box = document.getElementById('log');
  box.textContent = '';
  box.style.display = 日志目标 ? 'block' : 'none';
  if (日志目标) 拉日志();
}

function 拉日志() {
  if (!日志目标) return;
  api('/api/v1/tasks/' + 日志目标 + '/logs?after=' + 日志指针)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.total < 日志指针) {   // 服务端日志被截断 → 重置指针全量重拉
        日志指针 = 0;
        document.getElementById('log').textContent = '';
        return;
      }
      if (j.entries.length) {
        var box = document.getElementById('log');
        var atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
        j.entries.forEach(function (e) {
          box.appendChild(document.createTextNode(e.msg + '\n'));
        });
        if (atBottom) box.scrollTop = box.scrollHeight;
        日志指针 = j.total;
      }
    }).catch(function () {});
}

function 刷新任务() {
  api('/api/v1/tasks').then(function (r) { return r.json(); })
    .then(function (j) {
      var tb = document.getElementById('tasks');
      tb.textContent = '';
      j.任务.forEach(function (t) {
        var tr = document.createElement('tr');
        var td1 = document.createElement('td');
        td1.appendChild(document.createTextNode(t.标题 || t.url));
        td1.style.maxWidth = '200px'; td1.style.overflow = 'hidden';
        td1.style.textOverflow = 'ellipsis'; td1.style.whiteSpace = 'nowrap';
        var td2 = document.createElement('td');
        td2.className = 'st-' + t.状态;
        td2.textContent = t.状态;
        var td3 = document.createElement('td');
        td3.textContent = t.进度[1] ? (t.进度[0] + '/' + t.进度[1]) : '—';
        var td4 = document.createElement('td');
        td4.textContent = t.耗时秒 ? Math.floor(t.耗时秒 / 60) + 'm' +
                          (t.耗时秒 % 60) + 's' : '—';
        var td5 = document.createElement('td');
        if (t.状态 === 'running') {
          var b1 = document.createElement('button');
          b1.className = 'danger'; b1.textContent = '停';
          b1.onclick = function () { 停止(t.id); };
          td5.appendChild(b1);
        }
        if (t.状态 === 'interrupted') {
          var br = document.createElement('button');
          br.textContent = '续传';
          br.onclick = function () {
            api('/api/v1/tasks', { method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: t.url, resume: true,
                                       unique_title: false }) })
              .then(function () { 提示('已续传 ' + t.id); 刷新任务(); })
              .catch(function (e) { 提示('续传失败: ' + e.message); });
          };
          var bi = document.createElement('button');
          bi.className = 'sec'; bi.textContent = '忽略';
          bi.onclick = function () {
            api('/api/v1/tasks/' + t.id, { method: 'DELETE' })
              .then(刷新任务).catch(function (e) { 提示(e.message); });
          };
          td5.append(br, bi);
        }
        var b2 = document.createElement('button');
        b2.className = 'sec'; b2.textContent = '日志';
        b2.onclick = function () { 展开日志(t.id); };
        td5.appendChild(b2);
        tr.append(td1, td2, td3, td4, td5);
        tb.appendChild(tr);
      });
    }).catch(function (e) { 提示(e.message); });
}

function 刷新书架() {
  api('/api/v1/books').then(function (r) { return r.json(); })
    .then(function (j) {
      var box = document.getElementById('books');
      box.textContent = '';
      if (!j.书籍.length) {
        var s = document.createElement('span');
        s.className = 'dim'; s.textContent = '(暂无抓取结果)';
        box.appendChild(s); return;
      }
      j.书籍.forEach(function (b) {
        var row = document.createElement('div'); row.className = 'book';
        var name = document.createElement('span');
        name.textContent = b.标题 + '  (' + Math.round(b.大小 / 1024) + ' KB)';
        var ops = document.createElement('div'); ops.style.display = 'flex';
        ops.style.gap = '6px';
        var rd = document.createElement('a');
        rd.href = '/reader/' + b.id + '?k=' + token;
        var rb = document.createElement('button'); rb.textContent = '阅读';
        rd.appendChild(rb);
        var dl = document.createElement('a');
        dl.href = '/api/v1/books/' + b.id + '/epub?k=' + token;
        dl.setAttribute('download', '');
        var btn = document.createElement('button');
        btn.textContent = 'EPUB';
        dl.appendChild(btn);
        ops.append(rd, dl);
        row.append(name, ops);
        box.appendChild(row);
      });
    }).catch(function (e) {
      document.getElementById('books').textContent = '加载失败: ' + e.message;
    });
}

取token();
刷新任务(); 刷新书架();
setInterval(刷新任务, 2000);
setInterval(拉日志, 1500);
setInterval(刷新书架, 10000);
</script>
</body>
</html>
