<!doctype html>
<html>

.row{margin-top:18px;}
input{width:100%;box-sizing:border-box;height:42px;border:1px solid #ddd;border-radius:6px;padding:0 12px;font-size:16px;}
img{height:42px;border:1px solid #ddd;border-radius:6px;vertical-align:middle;cursor:pointer;}
button{width:100%;height:42px;border:0;border-radius:6px;background:#222;color:#fff;font-size:16px;cursor:pointer;}
