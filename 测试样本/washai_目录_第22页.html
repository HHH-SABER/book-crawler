    <meta name="keywords" content=",书海阁,书海阁小说,笔趣阁,小说,小说CMS,原创文学系统,开源小说系统,免费小说建站程序"/>
    <meta name="description" content="书海阁，书海阁小说，书海阁是一款功能完善的原创文学 CMS 系统，支持 PC、WAP 多端阅读，内置前台门户系统、作家后台管理系统、平台后台管理系统和爬虫管理系统。系统支持会员充值、小说订阅、新闻发布、实时数据统计、新书自动入库、老书自动更新等功能，可用于搭建小说网站、原创文学平台、阅读网站及开源小说系统。"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
<script>
(function (doc, win) {
    try {
        var path = String((win.location && win.location.pathname) || "").toLowerCase();
        var root = doc.documentElement;
        var addRootClass = function (token) {
            if (!token || !root || new RegExp("(^|\\s)" + token + "(\\s|$)").test(root.className || "")) {
                return;
            }
            root.className = (root.className ? root.className + " " : "") + token;
        };
        addRootClass("front-first-paint");

        var nav = "";
        if (path === "/" || path === "/index" || path === "/index.html") {
            nav = "home";
        } else if (path.indexOf("/book/bookclass") === 0) {
            nav = "bookclass";
        } else if (path.indexOf("/book/book_ranking") === 0) {
            nav = "ranking";
        } else if (path.indexOf("/pay/") === 0 || path === "/pay") {
            nav = "pay";
        } else if (path.indexOf("/author/") === 0 || path === "/author") {
            nav = "author";
        }
        if (nav) {
            addRootClass("front-nav-" + nav);
        }

        var isReadPage = /^\/book\/\d+\/\d+\.html$/.test(path) || path === "/book/book_content.html";
        if (isReadPage || !win.localStorage || win.localStorage.getItem("siteThemeMode") !== "dark") {
            return;
        }
        addRootClass("site-dark");
        var applyBodyDarkClass = function () {
            var body = doc.body;
            if (!body) {
                return false;
            }
            if (!/(^|\s)site-dark(\s|$)/.test(body.className || "")) {
                body.className = (body.className ? body.className + " " : "") + "site-dark";
            }
            return true;
        };
        if (!applyBodyDarkClass()) {
            if (win.MutationObserver) {
                var bodyObserver = new win.MutationObserver(function () {
                    if (applyBodyDarkClass()) {
                        bodyObserver.disconnect();
                    }
                });
                bodyObserver.observe(root, {childList: true});
            }
            doc.addEventListener("DOMContentLoaded", applyBodyDarkClass, false);
        }
    } catch (e) {
    }
})(document, window);
</script>

<script data-site-name="书海阁" data-site-domain="book.washai.net" data-site-logo="/localPic/2026/05/06/be5dec8d-31af-474e-9b13-2ca535dce417.transparent.png" data-site-logo-dark="/localPic/2026/05/06/be5dec8d-31af-474e-9b13-2ca535dce417.transparent.png" data-site-default-book-cover="/admin-static/img/default-book-cover.png" data-site-default-user-avatar="/localPic/2026/08/09/5bd46fdb-2365-44f6-a164-d6d3db058665.svg">
(function (script, doc) {
    if (!script) {
        return;
    }
    function attr(name) {
        var value = script.getAttribute(name) || "";
        return /\{\{SITE_[A-Z_]+\}\}/.test(value) ? "" : value;
    }
    function meta(name) {
        var el = doc.querySelector("meta[name='" + name + "']");
        return el ? (el.getAttribute("content") || "") : "";
    }
    window.__frontSiteInfo = {
        name: attr("data-site-name"),
        domain: attr("data-site-domain"),
        keyword: meta("keywords"),
        description: meta("description"),
        logo: attr("data-site-logo"),
        logoDark: attr("data-site-logo-dark"),
        defaultBookCover: attr("data-site-default-book-cover") || "/admin-static/img/default-book-cover.png",
        defaultUserAvatar: attr("data-site-default-user-avatar") || "/system-static/default-user-avatar.svg"
    };

    var avatarColors = ["#3b82f6", "#14b8a6", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899"];
    var builtInDefaultAvatars = {
        "/images/man.png": true,
        "/system-static/default-user-avatar.svg": true,
        "/admin-static/img/default-user-avatar.svg": true
    };

    function avatarName(user) {
        var source = user || {};
        return String(source.nickName || source.username || "未知用户").trim() || "未知用户";
    }

    function avatarInitial(name) {
        var normalized = String(name || "").trim();
        return normalized ? Array.from(normalized)[0].toLocaleUpperCase() : "?";
    }

    function avatarColor(name) {
        var normalized = String(name || "").trim();
        var hash = 0;
        Array.from(normalized).forEach(function (character) {
            hash = (hash * 31 + (character.codePointAt(0) || 0)) >>> 0;
        });
        return avatarColors[hash % avatarColors.length];
    }

    function isDefaultAvatar(photo) {
        var value = String(photo || "").trim();
        var configured = String(window.__frontSiteInfo.defaultUserAvatar || "").trim();
        return !value || builtInDefaultAvatars[value] || value === configured;
    }

    function normalizeAvatarPhoto(photo) {
        var value = String(photo || "").trim();
        var compact = value.toLowerCase().replace(/\s+/g, "");
        if (compact.indexOf("javascript:") === 0 || compact.indexOf("data:text/html") === 0) {
            return "";
        }
        return value;
    }

    function showInitial(element, name) {
        element.innerHTML = "";
        element.classList.add("user-initial-avatar");
        element.style.setProperty("--user-avatar-color", avatarColor(name));
        element.textContent = avatarInitial(name);
    }

    function renderAvatar(element, user) {
        if (!element) {
            return element;
        }
        var source = user || {};
        var name = avatarName(source);
        var photo = normalizeAvatarPhoto(source.userPhoto);
        element.classList.add("front-user-avatar");
        element.setAttribute("data-avatar-name", name);
        element.setAttribute("aria-label", name + "的头像");
        if (isDefaultAvatar(photo)) {
            showInitial(element, name);
            return element;
        }
        var image = doc.createElement("img");
        image.alt = "";
        image.src = photo;
        image.addEventListener("error", function () {
            showInitial(element, name);
        }, {once: true});
        element.innerHTML = "";
        element.classList.remove("user-initial-avatar");
        element.style.removeProperty("--user-avatar-color");
        element.appendChild(image);
        return element;
    }

    function createAvatar(user, className) {
        var element = doc.createElement("span");
        element.className = className || "";
        return renderAvatar(element, user);
    }

    function avatarMarkup(user, className) {
        return createAvatar(user, className).outerHTML;
    }

    doc.addEventListener("error", function (event) {
        var image = event.target;
        var avatar = image && image.parentElement;
        if (!avatar || !avatar.classList.contains("front-user-avatar")) {
            return;
        }
        showInitial(avatar, avatar.getAttribute("data-avatar-name") || "未知用户");
    }, true);

    window.FrontUserAvatar = {
        initial: avatarInitial,
        color: avatarColor,
        isDefault: isDefaultAvatar,
        render: renderAvatar,
        create: createAvatar,
        markup: avatarMarkup
    };
})(document.currentScript, document);
</script>
